<!DOCTYPE html>
<html lang="gl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>César Pablo Domínguez Prieto</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #f7f5f0;
      color: #222;
    }

    .home {
      min-height: 100vh;
      display: grid;
      grid-template-columns: 44% 56%;
    }

    .home-text {
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 8vw 5vw 8vw 7vw;
    }

    h1 {
      margin: 0 0 32px;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(3rem, 4.1vw, 4.7rem);
      font-weight: 400;
      line-height: 1.04;
      letter-spacing: -0.025em;
      white-space: nowrap;
    }

    .subtitle {
      font-family: Arial, Helvetica, sans-serif;
      font-size: 0.76rem;
      line-height: 1.4;
      letter-spacing: 0.11em;
      text-transform: uppercase;
      white-space: nowrap;
    }

    .subtitle div + div {
      margin-top: 12px;
    }

    .language-entry {
      display: flex;
      gap: 14px;
      flex-wrap: wrap;
      margin-top: 34px;
    }

    .enter {
      display: inline-block;
      padding: 13px 20px;
      border: 1px solid #222;
      color: #222;
      text-decoration: none;
      font-family: Arial, Helvetica, sans-serif;
      font-size: 0.74rem;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      transition: 0.25s ease;
    }

    .enter:hover {
      background: #222;
      color: #f7f5f0;
    }

    .social-links {
      display: flex;
      align-items: center;
      gap: 19px;
      margin-top: 28px;
    }

    .social-links a {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 22px;
      height: 22px;
      color: #222;
      text-decoration: none;
      transition: opacity 0.2s ease, transform 0.2s ease;
    }

    .social-links a:hover {
      opacity: 0.55;
      transform: translateY(-1px);
    }

    .social-links svg {
      width: 20px;
      height: 20px;
      display: block;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.7;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .social-links .linkedin-icon {
      fill: currentColor;
      stroke: none;
    }

    .home-image {
      width: 100%;
      height: 100vh;
      overflow: hidden;
    }

    .home-image img {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
      object-position: center;
      filter: grayscale(100%);
    }

    @media (max-width: 850px) {
      .home {
        grid-template-columns: 1fr;
      }

      .home-text {
        padding: 56px 28px 48px;
      }

      h1 {
        font-size: clamp(2.8rem, 11vw, 4.4rem);
        white-space: normal;
      }

      .subtitle {
        font-size: 0.72rem;
        line-height: 1.5;
        white-space: normal;
      }

      .subtitle div + div {
        margin-top: 10px;
      }

      .language-entry {
        gap: 10px;
      }

      .social-links {
        margin-top: 26px;
      }

      .home-image {
        height: 65vh;
      }
    }
  </style>
</head>

<body>

  <main class="home">

    <section class="home-text">

      <h1>
        César Pablo<br>
        Domínguez Prieto
      </h1>

      <div class="subtitle">

        <div>
          Literatura Comparada · Literatura Mundial · Humanidades Aplicadas
        </div>

        <div>
          Comparative Literature · World Literature · Applied Humanities
        </div>

      </div>

      <div class="language-entry">

        <a class="enter" href="en/">
          Enter website
        </a>

        <a class="enter" href="gl/">
          Acceda á páxina web
        </a>

      </div>

      <div class="social-links">

        <!-- LinkedIn -->
        <a
          href="https://www.linkedin.com/in/cesardominguezprieto/"
          target="_blank"
          rel="noopener"
          aria-label="LinkedIn"
          title="LinkedIn"
        >
          <svg
            class="linkedin-icon"
            viewBox="0 0 24 24"
            aria-hidden="true"
          >
            <path d="M5.2 8.4H2.1V21h3.1V8.4ZM3.65 2.9A1.83 1.83 0 1 0 3.65 6.56 1.83 1.83 0 0 0 3.65 2.9ZM21.9 13.77c0-3.79-2.02-5.55-4.72-5.55-2.18 0-3.15 1.2-3.69 2.04V8.4h-3.1V21h3.1v-6.24c0-1.64.31-3.23 2.35-3.23 2.01 0 2.04 1.88 2.04 3.34V21H21v-6.96c0-.09-.03-.18-.03-.27Z"/>
          </svg>
        </a>

        <!-- Instagram -->
        <a
          href="https://www.instagram.com/cesarpablodominguez/"
          target="_blank"
          rel="noopener"
          aria-label="Instagram"
          title="Instagram"
        >
          <svg
            viewBox="0 0 24 24"
            aria-hidden="true"
          >
            <rect x="3" y="3" width="18" height="18" rx="5"></rect>
            <circle cx="12" cy="12" r="4"></circle>
            <circle cx="17.5" cy="6.5" r="0.8" fill="currentColor" stroke="none"></circle>
          </svg>
        </a>

        <!-- Perfil de investigación USC -->
        <a
          href="https://investigacion.usc.gal/investigadores/58799/detalle"
          target="_blank"
          rel="noopener"
          aria-label="Perfil de investigación USC"
          title="Perfil de investigación USC"
        >
          <svg
            viewBox="0 0 24 24"
            aria-hidden="true"
          >
            <path d="M3 9h18"></path>
            <path d="M5 9v9"></path>
            <path d="M9.5 9v9"></path>
            <path d="M14.5 9v9"></path>
            <path d="M19 9v9"></path>
            <path d="M3 18h18"></path>
            <path d="M2 21h20"></path>
            <path d="M12 3L3 8h18L12 3Z"></path>
          </svg>
        </a>

        <!-- E-mail -->
        <a
          href="mailto:cesar.dominguez@usc.gal"
          aria-label="E-mail"
          title="E-mail"
        >
          <svg
            viewBox="0 0 24 24"
            aria-hidden="true"
          >
            <rect x="3" y="5" width="18" height="14" rx="1"></rect>
            <path d="M4 7l8 6 8-6"></path>
          </svg>
        </a>

      </div>

    </section>

    <section class="home-image">

      <img
        src="home-reading.jpeg"
        alt=""
      >

    </section>

  </main>

</body>
</html>
