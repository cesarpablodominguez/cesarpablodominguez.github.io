<!DOCTYPE html>
<html lang="gl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>César Pablo Domínguez Prieto</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #f7f5f0;
      color: #222;
    }

    .home {
      min-height: 100vh;
      display: grid;
      grid-template-columns: 44% 56%;
    }

    .home-text {
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 8vw;
    }

    h1 {
      margin: 0 0 32px;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(3rem, 4.8vw, 5.4rem);
      font-weight: 400;
      line-height: 1.02;
      letter-spacing: -0.025em;
    }

    .subtitle {
      font-family: Arial, Helvetica, sans-serif;
      font-size: 0.82rem;
      line-height: 1.45;
      letter-spacing: 0.13em;
      text-transform: uppercase;
      max-width: 620px;
    }

    .subtitle div + div {
      margin-top: 9px;
    }

    .language-entry {
      display: flex;
      gap: 14px;
      flex-wrap: wrap;
      margin-top: 34px;
    }

    .enter {
      display: inline-block;
      padding: 13px 20px;
      border: 1px solid #222;
      color: #222;
      text-decoration: none;
      font-family: Arial, Helvetica, sans-serif;
      font-size: 0.74rem;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      transition: 0.25s ease;
    }

    .enter:hover {
      background: #222;
      color: #f7f5f0;
    }

    .home-image {
      width: 100%;
      height: 100vh;
      overflow: hidden;
    }

    .home-image img {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
      object-position: center;
      filter: grayscale(100%);
    }

    @media (max-width: 850px) {
      .home {
        grid-template-columns: 1fr;
      }

      .home-text {
        padding: 56px 28px 48px;
      }

      .home-image {
        height: 65vh;
      }

      h1 {
        font-size: clamp(2.8rem, 11vw, 4.4rem);
      }

      .subtitle {
        font-size: 0.76rem;
      }
    }
  </style>
</head>

<body>

  <main class="home">

    <section class="home-text">

      <h1>
        César Pablo<br>
        Domínguez Prieto
      </h1>

      <div class="subtitle">
        <div>
          Literatura Comparada · Literatura Mundial · Humanidades Aplicadas
        </div>
        <div>
          Comparative Literature · World Literature · Applied Humanities
        </div>
      </div>

      <div class="language-entry">
        <a class="enter" href="en/">Enter website</a>
        <a class="enter" href="gl/">Acceda á páxina web</a>
      </div>

    </section>

    <section class="home-image">
      <img src="home-reading.jpeg" alt="">
    </section>

  </main>

</body>
</html>
